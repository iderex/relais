# The build gate. It compiles every package in the tree from a clean checkout on a
# stock runner and reds on a compilation failure.
#
# This is the first check here that can fail for a reason belonging to this
# project rather than to its workflows, and every later check assumes it: a lint
# result, a test result and a coverage number are all meaningless on a tree that
# does not compile.
#
# Go has no warning tier to decide about. The things other languages warn on, an
# unused import or an unused local, are already refusals in this compiler, so the
# "treat it as an error rather than accumulating a backlog" decision has no
# surface at this step. The remaining class is what `go vet` and the linter set
# judge, and that is a separate gate with its own decision to record (#19).
#
# Hardened the same way as the other workflows here: actions SHA-pinned with a
# version comment, checkout with persist-credentials false, permissions denied at
# the top level and granted only on the job.
name: Build

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Deny by default; the job takes only what it needs.
permissions: {}

# A newer push on the same ref supersedes an in-flight run. Compiling is
# idempotent and cheap to repeat, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run name this produces is quoted literally by the branch protection
  # request in #29. A required check that names a job which was renamed is worse
  # than no requirement at all, so this name changes only together with that
  # issue.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Set up the toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod rather than repeated here. There is one place the
          # toolchain version is written, so a bump cannot leave a second copy
          # behind to drift against it.
          go-version-file: go.mod
          # Do not silently move to a newer release than go.mod asks for; the
          # point of reading the file is that the file decides.
          check-latest: false
          # The tree has no third-party dependency and therefore no go.sum for a
          # cache key to hash. Turn the cache off explicitly rather than let the
          # step fail looking for a file that is absent by design. It comes back
          # with the first dependency, which is the moment there is a lock file to
          # hash; the dependency gate is what refuses one that arrives without.
          cache: false

      - name: Report the toolchain actually used
        # Printed rather than asserted: the run says which version compiled the
        # tree, so a claim about the pin can be checked against the log instead of
        # against the workflow file.
        run: go version

      - name: Build every package
        # The output goes outside the checkout, and that is load-bearing rather
        # than tidiness. `go build ./...` writes its executable into the working
        # directory, git then reports the tree as modified, and the toolchain
        # stamps that state into every binary built afterwards. The first version
        # of this step left the output in place and the bill of materials below
        # described a clean checkout as `+dirty`, which is a false statement about
        # the artefact an operator would be reading.
        #
        # `-o` with a trailing separator names a directory, which is what lets one
        # step compile every package and still produce the binary the next step
        # describes.
        run: go build -o "$RUNNER_TEMP/build/" ./...

      # An operator running this on their own hardware is the person who has to
      # answer a vulnerability question about it, and they cannot do that from a
      # binary alone. The bill of materials is how they answer it without reading
      # this repository.
      #
      # It is produced by the build rather than beside it: the file below is the
      # binary the step above produced, so the document describes the artefact
      # rather than a separate scan of the source tree that might disagree with it.
      - name: Produce the bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          # The compiled binary, not the directory. A binary carries the module
          # graph the toolchain actually linked, so the document cannot claim a
          # dependency that was resolved away or miss one that was pulled in.
          file: ${{ runner.temp }}/build/relais
          # SPDX, because it is the ISO-standardised format of the two common ones
          # and an operator is more likely to have something that reads it. The
          # JSON encoding rather than the tag-value one, because the consumer here
          # is a tool.
          format: spdx-json
          artifact-name: relais-sbom.spdx.json
          # Do not attach it to a release from this workflow. This gate runs on
          # every pull request, and publishing belongs to the release route in
          # #113.
          upload-release-assets: false
